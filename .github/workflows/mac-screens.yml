name: Mac screenshots

on:
  pull_request:
    paths:
      - "apps/mac/**"
      - "apps/web/lib/native-ui.ts"
      - "apps/web/lib/shell.ts"
      - "apps/web/components/conversation*.tsx"
      - "apps/web/components/sidebar.tsx"
      - "apps/web/components/shell.tsx"
      - "apps/web/components/settings-page.tsx"
      - ".github/workflows/mac-screens.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screens:
    name: Screenshots
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      SERVER: http://127.0.0.1:3005
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --filter @gond/web build
      - name: Start a throwaway Gond
        run: |
          mkdir -p "$RUNNER_TEMP/gond" "$RUNNER_TEMP/screens"
          (cd apps/api && GOND_DATA_DIR="$RUNNER_TEMP/gond" GOND_SETUP_TOKEN=screens PORT=8799 APP_URL="$SERVER" nohup bun run src/index.ts > "$RUNNER_TEMP/screens/api.log" 2>&1 &)
          (cd apps/web && GOND_API_URL=http://127.0.0.1:8799 nohup bunx --bun next start -H 127.0.0.1 -p 3005 > "$RUNNER_TEMP/screens/web.log" 2>&1 &)
          for i in $(seq 90); do curl -sf "$SERVER/api/health" > /dev/null && break; sleep 2; done
          curl -sf "$SERVER/api/health"
      - name: Register and seed
        run: |
          curl -sf -D "$RUNNER_TEMP/headers" -o /dev/null -X POST "$SERVER/api/register" -H "Origin: $SERVER" -H "Content-Type: application/json" \
            -d '{"token":"screens","username":"screens","password":"screens-pass-123","confirm":"screens-pass-123"}'
          cookie=$(grep -i '^set-cookie: better-auth.session_token=' "$RUNNER_TEMP/headers" | head -1 | sed -E 's/^[^:]*: *//; s/;.*$//' | tr -d '\r')
          [ -n "$cookie" ] || { echo "No session cookie"; cat "$RUNNER_TEMP/headers"; exit 1; }
          read -r thread room < <(GOND_DATA_DIR="$RUNNER_TEMP/gond" bun apps/ios/scripts/screens-seed.ts | tail -1)
          { echo "SCREENS_COOKIE=$cookie"; echo "SCREENS_THREAD=$thread"; echo "SCREENS_ROOM=$room"; } >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - working-directory: apps/mac
        run: xcodegen generate
      # A Mac UI test drives the app through accessibility, which macOS allows only after someone
      # approves it; nobody can on a runner, so the approval is turned off.
      - name: Let the UI tests drive the app
        run: sudo automationmodetool enable-automationmode-without-authentication || echo "Couldn't turn off the automation approval; the UI tests may wait on it and fail."
      # The runner's screen is small: the Dock out of the way gives the window the whole height. What
      # graphics the runner has decides how WebKit can draw, so it is kept with the screenshots.
      - name: Make room on the screen
        run: |
          defaults write com.apple.dock autohide -bool true && killall Dock || true
          sleep 3
          system_profiler SPDisplaysDataType > "$RUNNER_TEMP/screens/displays.txt" 2>&1 || true
          sw_vers >> "$RUNNER_TEMP/screens/displays.txt" 2>&1 || true
      - name: Take the screenshots
        working-directory: apps/mac
        env:
          TEST_RUNNER_GOND_SCREENS_SERVER: ${{ env.SERVER }}
          TEST_RUNNER_GOND_SCREENS_COOKIE: ${{ env.SCREENS_COOKIE }}
          TEST_RUNNER_GOND_SCREENS_THREAD: ${{ env.SCREENS_THREAD }}
          TEST_RUNNER_GOND_SCREENS_ROOM: ${{ env.SCREENS_ROOM }}
          # The runner is a VM whose paravirtual GPU can't take WebKit's accelerated drawing: the page lays
          # out but never shows, and a canvas can't be read back. Drawn in memory, it shows as on a Mac.
          TEST_RUNNER_GOND_SCREENS_WEBKIT_OFF: AcceleratedDrawingEnabled,CanvasUsesAcceleratedDrawing
        run: |
          set -o pipefail
          export TEST_RUNNER_GOND_SCREENS_DIR="$RUNNER_TEMP/screens"
          for appearance in light dark; do
            # The app sets its own appearance from the environment; the system's too keeps the menu bar
            # and the desktop behind the window in step.
            if [ "$appearance" = dark ]; then dark=true; else dark=false; fi
            osascript -e 'with timeout of 20 seconds' -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" -e 'end timeout' \
              || echo "Couldn't set the system to $appearance; the app sets its own."
            TEST_RUNNER_GOND_SCREENS_APPEARANCE="$appearance" xcodebuild test -project Gond.xcodeproj -scheme GondScreens -destination 'platform=macOS' \
              -resultBundlePath "$RUNNER_TEMP/mac-screens-$appearance.xcresult" CODE_SIGN_IDENTITY=- 2>&1 | tee "$RUNNER_TEMP/screens/xcodebuild-$appearance.log" | grep -E '\[screens\]|error:|failed|passed|Test Case' || true
          done
          log show --last 40m --info --debug --style compact --predicate 'subsystem == "io.gond.mac"' > "$RUNNER_TEMP/screens/app.log" || true
      - name: Keep WebKit's errors and any crashes
        if: always()
        run: |
          log show --last 40m --style compact --predicate '(process BEGINSWITH "com.apple.WebKit" OR (process == "Gond" AND subsystem BEGINSWITH "com.apple.WebKit")) AND (messageType == error OR messageType == fault)' 2>&1 | tail -n 6000 > "$RUNNER_TEMP/screens/webkit.log" || true
          mkdir -p "$RUNNER_TEMP/screens/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -mmin -60 \( -name '*WebKit*' -o -name 'Gond*' \) -exec cp {} "$RUNNER_TEMP/screens/crashes/" \; 2>/dev/null || true
      - name: Keep the attachments too
        if: always()
        run: |
          for appearance in light dark; do
            [ -d "$RUNNER_TEMP/mac-screens-$appearance.xcresult" ] || continue
            mkdir -p "$RUNNER_TEMP/screens/xcresult-$appearance"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/mac-screens-$appearance.xcresult" --output-path "$RUNNER_TEMP/screens/xcresult-$appearance" || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
