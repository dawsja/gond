# The Xcode project is generated from this file (`xcodegen generate`), so
# no .xcodeproj is checked in. CI does it on a macOS runner; on a Mac,
# `brew install xcodegen` and run it in apps/ios.
name: Gond
options:
  bundleIdPrefix: io.gond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Gond:
    type: application
    platform: iOS
    sources:
      - path: Gond
      # Icon Composer's Liquid Glass icon; one file to Xcode, which also draws the flat icons older iOS shows.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Gond/Info.plist
      properties:
        CFBundleDisplayName: Gond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Gond uses the microphone when you talk to your bots instead of typing.
        NSLocalNetworkUsageDescription: Gond connects to your Gond, which may run on your home network.
        # A Gond is self-hosted, often at a plain-http address on a home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
  GondTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GondTests
    dependencies:
      - target: Gond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios.tests
        GENERATE_INFOPLIST_FILE: true
  GondUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GondUITests
    dependencies:
      - target: Gond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Gond
schemes:
  Gond:
    build:
      targets:
        Gond: all
        GondTests: [test]
    test:
      targets:
        - GondTests
  # Screenshots for review, against a seeded Gond (.github/workflows/ios-screens.yml); never part of `Gond`'s tests.
  GondScreens:
    build:
      targets:
        Gond: all
        GondUITests: [test]
    test:
      targets:
        - GondUITests
