# The Xcode project is generated from this file (`xcodegen generate`), so
# no .xcodeproj is checked in. CI does it on a macOS runner; on a Mac,
# `brew install xcodegen` and run it in apps/ios.
name: Gond
options:
  bundleIdPrefix: io.gond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Push through Firebase (Push.swift); only its messaging is used.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.0.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Gond:
    type: application
    platform: iOS
    sources:
      - path: Gond
      - path: Shared
      # Icon Composer's Liquid Glass icon; one file to Xcode, which also draws the flat icons older iOS shows.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Gond/Info.plist
      properties:
        CFBundleDisplayName: Gond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Gond uses the microphone when you talk to your bots instead of typing.
        NSLocalNetworkUsageDescription: Gond connects to your Gond, which may run on your home network.
        # A Gond is self-hosted, often at a plain-http address on a home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # A card answered elsewhere comes as a background push that takes its notification away.
        # A call with a bot goes on in the background: WebKit keeps a page's microphone running there
        # only for an app with the audio mode, and iOS shows the call in the status bar meanwhile.
        UIBackgroundModes:
          - remote-notification
          - audio
        # The app delegate hands Firebase the APNs token itself (Push.swift).
        FirebaseAppDelegateProxyEnabled: false
    # The App Group shares the push keys' keychain with the notification service extension.
    entitlements:
      path: Gond/Gond.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.io.gond.ios
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - target: GondNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
  # Opens each push with the phone's key and shows what it says (NotificationService.swift).
  GondNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: GondNotifications
      - path: Shared
    info:
      path: GondNotifications/Info.plist
      properties:
        CFBundleDisplayName: Gond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: GondNotifications/GondNotifications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.gond.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios.notifications
        TARGETED_DEVICE_FAMILY: "1"
  GondTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GondTests
    dependencies:
      - target: Gond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios.tests
        GENERATE_INFOPLIST_FILE: true
  GondUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GondUITests
    dependencies:
      - target: Gond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gond.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Gond
schemes:
  Gond:
    build:
      targets:
        Gond: all
        GondTests: [test]
    test:
      targets:
        - GondTests
  # Screenshots for review, against a seeded Gond (.github/workflows/ios-screens.yml); never part of `Gond`'s tests.
  GondScreens:
    build:
      targets:
        Gond: all
        GondUITests: [test]
    test:
      targets:
        - GondUITests
