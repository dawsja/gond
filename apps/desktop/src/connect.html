<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gond</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <header data-window-drag>
      <img src="logo.svg" alt="" width="28" height="28" />
      <span>Gond</span>
      <div class="window" id="window" role="group" aria-label="Window" hidden>
        <button type="button" data-window="minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
        <button type="button" data-window="maximize" aria-label="Maximize">
          <svg class="maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" /></svg>
          <svg class="restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="matrix(-1 0 0 1 24 0)"><rect x="8" y="8" width="14" height="14" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></g></svg>
        </button>
        <button type="button" data-window="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></button>
      </div>
    </header>
    <main>
      <img class="team" src="team.svg" alt="" width="360" height="176" />
      <h1>Where is your Gond?</h1>
      <p class="description">Enter the address you open Gond at in your browser.</p>
      <form id="connect" novalidate>
        <div class="field" id="field">
          <label for="server">Address</label>
          <input id="server" name="server" type="text" inputmode="url" placeholder="https://gond.example.com" autocomplete="url" autocapitalize="none" spellcheck="false" required aria-describedby="error" />
          <p class="error" id="error" role="alert" hidden></p>
        </div>
        <button type="submit" id="submit">
          <span class="spinner" aria-hidden="true" hidden></span>
          <span id="label">Connect</span>
        </button>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
