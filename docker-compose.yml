services:
  web:
    image: ${GOND_WEB_IMAGE:-${KRU_WEB_IMAGE:-ghcr.io/dawsja/gond-web:latest}}
    # To build from source instead, uncomment `build` here, on the api and
    # on the box, and run `docker compose up -d --build` from a clone.
    # build:
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Reachable only from this machine. Put a reverse proxy with HTTPS in
      # front of it for remote access (see README).
      - "${GOND_PORT:-${KRU_PORT:-3000}}:3000"
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      - GOND_API_URL=http://api:8790
    depends_on:
      - api

  api:
    image: ${GOND_API_IMAGE:-${KRU_API_IMAGE:-ghcr.io/dawsja/gond-api:latest}}
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Must match the address you open in the browser.
      - APP_URL=${APP_URL:-http://localhost:3000}
      # Optional; passed through only when set in your shell or .env file.
      # The KRU_* names are legacy and still read this release.
      - GOND_SECRET_KEY
      - KRU_SECRET_KEY
      - GOND_SETUP_TOKEN
      - KRU_SETUP_TOKEN
      - BETTER_AUTH_SECRET
      - COMPOSIO_API_KEY
      - COMPOSIO_TOOLKITS
      - GOND_APPROVAL_TIMEOUT_MINUTES
      - KRU_APPROVAL_TIMEOUT_MINUTES
      # The box, where every bot has its computer. Required.
      - GOND_BOX_URL=http://box:8787
      # Where the box reaches this API: your HTTP MCP servers go through it.
      - GOND_API_INTERNAL_URL=http://api:8790
      - GOND_NUDGE_MINUTES
      - KRU_NUDGE_MINUTES
      - GOND_TURN_TIMING
      # Only for an MCP server that will not register Gond as an OAuth client itself.
      - GOND_MCP_CLIENT_ID
      - KRU_MCP_CLIENT_ID
      - GOND_MCP_CLIENT_SECRET
      - KRU_MCP_CLIENT_SECRET
    volumes:
      - gond-data:/data
      # The box writes its access token here on first start.
      - gond-box-state:/box-state:ro
      # Settings → Team → Update pulls the newest box image from GHCR and
      # recreates the box through this socket. Whoever can use it can control
      # Docker on this machine, so it is the one thing here with host access;
      # remove this line to keep updates to in-place patching only.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - box

  box:
    image: ${GOND_BOX_IMAGE:-${KRU_BOX_IMAGE:-ghcr.io/dawsja/gond-box:latest}}
    # build: ./packages/box
    restart: unless-stopped
    environment:
      - BOT_IDLE_MS
    volumes:
      # The register of accounts, so a recreated box makes the same users
      # again with the same ids.
      - gond-box-state:/state
      - gond-box-homes:/home
      # The box is not a throwaway: what the bots set up for themselves
      # survives restarts and image updates.
      - gond-box-home:/home/agent
      - gond-box-bots:/home/agent/.bots
      - gond-box-cache:/home/agent/.cache
      # The API never reads this sign-in.
      - gond-box-claude:/home/agent/.claude
    security_opt:
      - no-new-privileges:true
    # The desktop's X server and GTK apps share pixmaps through /dev/shm.
    shm_size: ${GOND_BOX_SHM:-${KRU_BOX_SHM:-256m}}
    pids_limit: 4096
    mem_limit: ${GOND_BOX_MEMORY:-${KRU_BOX_MEMORY:-4g}}
    cpus: ${GOND_BOX_CPUS:-${KRU_BOX_CPUS:-2}}

volumes:
  gond-data:
  gond-box-state:
  gond-box-homes:
  gond-box-home:
  gond-box-bots:
  gond-box-cache:
  gond-box-claude:
