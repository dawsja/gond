# A Gond for the benchmark, built from this checkout, with turn and screen timing on.
# From the repo root:
#   docker compose -p gond-bench -f docker-compose.yml -f packages/bench/compose.bench.yml up -d --build
# It runs as its own project with its own volumes, so it never touches a Gond you use.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: gond-bench-web
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: gond-bench-api
    environment:
      - GOND_TURN_TIMING=1
      - GOND_SETUP_TOKEN=${GOND_SETUP_TOKEN:-bench-setup-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  box:
    build: ./packages/box
    image: gond-bench-box
    environment:
      - GOND_SCREEN_TIMING=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
